{% extends "base.html" %}
{% block title %}Projetos{% endblock %}
{% block content %}

<div class="row">
  <div class="col-md-5">
    <h3>Novo Projeto</h3>
    <form method="post" class="bg-white p-4 rounded shadow-sm">
      <div class="mb-3">
        <label class="form-label">Nome</label>
        <input type="text" name="nome" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Descrição</label>
        <textarea name="descricao" class="form-control" rows="3"></textarea>
      </div>
      <button class="btn btn-primary">Criar Projeto</button>
    </form>
  </div>

  <div class="col-md-7">
    <h3>Projetos</h3>
    <table class="table table-bordered bg-white">
      <thead class="table-dark">
        <tr><th>Nome</th><th>Descrição</th><th>Ações</th></tr>
      </thead>
      <tbody>
        {% for p in projetos %}
        <tr>
          <td>{{ p.nome }}</td>
          <td>{{ p.descricao }}</td>
          <td>
            <form action="{{ url_for('excluir_projeto', projeto_id=p.id) }}" method="post"
                  onsubmit="return confirm('Excluir este projeto?');">
              <button class="btn btn-sm btn-danger">Excluir</button>
            </form>
          </td>
        </tr>
        {% else %}
        <tr><td colspan="3" class="text-center text-muted">Nenhum projeto cadastrado.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
